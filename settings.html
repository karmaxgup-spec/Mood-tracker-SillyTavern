<div id="st-mood-tracker-settings" class="mt-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Mood Tracker</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label class="checkbox_label"><input id="mt-enabled" type="checkbox" /> Enabled</label>
      <label class="checkbox_label"><input id="mt-showwidget" type="checkbox" /> Show mood bar above chat input</label>
      <label class="checkbox_label"><input id="mt-sarcasm" type="checkbox" /> Sarcasm detection</label>
      <label class="checkbox_label"><input id="mt-inject" type="checkbox" /> Inject mood into prompt</label>

      <div class="mt-field">
        <label for="mt-depth">Injection depth (0 to 8)</label>
        <input id="mt-depth" type="number" min="0" max="8" step="1" />
      </div>
      <div class="mt-field">
        <label for="mt-alpha">Smoothing alpha (0 to 1)</label>
        <input id="mt-alpha" type="number" min="0" max="1" step="0.05" />
      </div>
      <div class="mt-field">
        <label for="mt-halflife">Decay half-life (hours)</label>
        <input id="mt-halflife" type="number" min="0.1" max="168" step="0.5" />
      </div>
      <div class="mt-field">
        <label for="mt-minconf">Minimum confidence to update (0 to 1)</label>
        <input id="mt-minconf" type="number" min="0" max="1" step="0.05" />
      </div>

      <div class="mt-actions">
        <button id="mt-reset" class="menu_button" type="button">Reset chat mood</button>
      </div>
      <small class="mt-note">Analysis is local. No messages leave your device.</small>
    </div>
  </div>
</div>
